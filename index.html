</script><script>/* Preference learning is local to this browser; each dated edition freezes its order. */
(function(root){
function score(article,votes,date){let sum=0;const target=Date.parse(date);for(const v of Object.values(votes)){const age=Math.max(0,(target-Date.parse(v.date))/86400000);const overlap=article.tags.filter(t=>v.tags.includes(t)).length;sum+=v.value*Math.pow(.98,age)*Math.min(2,overlap)*.24;}return Math.max(-2,Math.min(2,sum));}
function order(items,votes,date,saved){const ids=new Set(items.map(x=>x.id));if(saved){const kept=saved.filter(id=>ids.has(id));return [...kept,...items.filter(x=>!kept.includes(x.id)).map(x=>x.id)];}return items.map((x,i)=>({id:x.id,value:(items.length-i)/items.length+score(x,votes,date)})).sort((a,b)=>b.value-a.value).map(x=>x.id);}
root.ResearchRanking={score,order};if(typeof module!=='undefined')module.exports=root.ResearchRanking;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>const key='wendy-research-preferences-v1';
let state={votes:{},orders:{}},persistent=true;
try{state=JSON.parse(localStorage.getItem(key))||state;}catch(e){persistent=false;}
state.votes ||= {};state.orders ||= {};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const feed=document.querySelector('#feed'),status=document.querySelector('#status');
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true;}catch(e){persistent=false;return false;}}
function render(){
  const dayItems=articles.filter(a=>a.date<=edition.date);
  const ids=ResearchRanking.order(dayItems,state.votes,edition.date,state.orders[edition.date]).slice(0,100);
  state.orders[edition.date]=ids;
  for(const day of Object.keys(state.orders).sort().slice(0,-14))delete state.orders[day];
  save();
  document.querySelector('#date').textContent=edition.date+' · '+ids.length+' 条';
  const counts=edition.counts,sourceCounts=document.querySelector('#source-counts');
  if(counts){const countText=(name,value)=>Number.isFinite(value.retrieved)?`${name} ${edition.date} 已获取 ${value.retrieved} 篇（接口总量 ${value.reported}）`:`${name} ${edition.date} 未执行（接口总量 ${value.reported}）`;sourceCounts.textContent=countText('SignalBase',counts.SignalBase)+' · '+countText('YZData',counts.YZData);}
  feed.innerHTML=ids.map(id=>{const a=dayItems.find(x=>x.id===id);return `<article data-id="${esc(id)}"><details><summary><h2>${esc(a.title)}</h2><p class="brief">${esc(a.brief)}</p><div class="meta">${esc(a.date)} · ${esc(a.source)} · <span class="kind ${a.library==='YZData'?'kind-expert':''}">${esc(a.kind)}</span><span class="more">展开关键点</span></div></summary><div class="detail">${a.points.map(p=>`<section><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p><small>${esc(a.cite)}</small></section>`).join('')}<p class="original">${esc(a.original)}</p></div></details><div class="controls"><small>${esc(a.cite)}</small><div class="votes" aria-label="调整未来排序"><button data-value="1" aria-label="提高此类内容未来排序" title="更想看此类内容">↑</button><button data-value="-1" aria-label="降低此类内容未来排序" title="减少此类内容">↓</button></div></div></article>`}).join('');
  if(!dayItems.length)feed.innerHTML='<p class="empty">'+esc(edition.status==='error'?'该资料日暂时无法更新，稍后重试。':'该资料日暂无新文章。')+'</p>';
  function paint(article){const vote=state.votes[article.dataset.id]?.value;article.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',vote===Number(b.dataset.value)));}
  feed.querySelectorAll('article').forEach(el=>{
    paint(el);
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const a=dayItems.find(x=>x.id===el.dataset.id),value=Number(b.dataset.value),previous=state.votes[a.id];
      const next=previous?.value===value?0:value;
      if(next===0)delete state.votes[a.id];else state.votes[a.id]={value:next,tags:a.tags,date:edition.date};
      save();paint(el);
    });
  });
}

render();
if(!persistent)status.textContent='浏览器未允许保存，排序偏好暂时无法在本机保留。';
